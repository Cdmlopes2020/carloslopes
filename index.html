<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carlos | Grid estilo</title>

  <!-- ========== FONTS ========== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <!-- ========== CSS ========== -->
  <link rel="stylesheet" href="css/custom.css">
  <script src="https://cdn.tailwindcss.com"></script>



  <script src="https://cdn.tailwindcss.com"></script>


</head>

<body id="siteBody" class="backgrounddark">
  <div id="splash" class="test">


    <h1 class="text-center font-['Fira_Mono'] text-6xl animate__animated animate__tada ">Welcome.</h1>
  </div>
<div class="noise-overlay">
  <img src="assets/noise.jpg" alt="noise texture">
</div>

<style>
  .noise-overlay {
  position: fixed;
  inset: 0; /* top: 0; right: 0; bottom: 0; left: 0 */
  z-index: 50; /* ou ajusta para ficar por cima de fundo mas atrás de UI */
  pointer-events: none; /* permite clicar através */
  mix-blend-mode: overlay; /* efeito de sobreposição subtil */
  opacity: 0.5; /* controla a intensidade do noise */
}

.noise-overlay img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>

  <div class="textbehind text-center">
    <h1 class="font-['Fira_Mono'] text-6xl sm:text-8xl"> Portfólio</h1>
  </div>
  

  <!-- ========== HEADER ========== -->

  <nav class="flex items-center justify-between text-white p-6">
    <!-- ESQUERDA -->
    <div class="flex items-center space-x-6">
      <a href="#" id="linkCarlos" class="text-xs sm:text-sm md:text-sm font-['Fira_Mono'] animate__animated text-white">
        Carlos Lopes
      </a>
      <span class="text-xs sm:text-sm md:text-sm font-['Fira_Mono']">Graphic & Web Design </span>
    </div>

    <!-- DIREITA BOTÃO TOOGLE -->
    <div>

      <label class="inline-flex items-center cursor-pointer">
        <!-- Input escondido -->
        <input type="checkbox" class="sr-only" id="toggleMode" />

        <!-- Trilho e bola dentro -->
        <div class="track w-10 h-5 bg-gray-300 rounded-full relative transition-colors duration-300">
          <div class="ball absolute top-0.5 left-0.5 bg-white w-4 h-4 rounded-full transition-transform duration-300">
          </div>
        </div>
      </label>

    </div>
  </nav>
  <!-- ========== BODY ========== -->




  <div class="grid grid-cols-4  sm:grid-cols-8 md:grid-cols-8 gap-2 pt-44 p-6">
    <!-- ROW 1-->
    <div class="glass customcard col-span-4 rounded-xl sm:col-span-4 md:col-span-2 pt-32 sm:pt-64 pb-2 ">
      <div class="grid-rows-1 flex ">
        <h1 class="text-white pl-4 font-['Fira_Mono'] about" >About</h1>
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path d="M7 17L17 7M17 7H8M17 7V16" stroke="#ffffff" stroke-width="1" stroke-linecap="round"
              stroke-linejoin="round"></path>
          </g>
        </svg>

      </div>
    </div>

    <div class="col-span-4 rounded-xl sm:col-span-4 md:col-span-6 customcard pt-32 sm:pt-64 pb-2">
      <div class="grid-rows-1 flex ">
        <h1 class="text-white pl-4 font-['Fira_Mono'] portfolio">Portfólio</h1>
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path d="M7 17L17 7M17 7H8M17 7V16" stroke="#ffffff" stroke-width="1" stroke-linecap="round"
              stroke-linejoin="round"></path>
          </g>
        </svg>
      </div>
    </div>
    <!-- ROW 2-->

    <div class="col-span-2 rounded-xl sm:col-span-4 md:col-span-4 customcard pt-32 sm:pt-64 pb-2">
      <div class="grid-rows-1 flex ">
        <h1 class="text-white pl-4 font-['Fira_Mono'] contact">Contact</h1>
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
          <g id="SVGRepo_iconCarrier">
            <path d="M7 17L17 7M17 7H8M17 7V16" stroke="#ffffff" stroke-width="1" stroke-linecap="round"
              stroke-linejoin="round"></path>
          </g>
        </svg>
      </div>

    </div>

    <div class="col-span-2 rounded-xl sm:col-span-2 md:col-span-2 customcard pt-32 sm:pt-64 pb-2">

      <img class="avatar" src="assets/avatar.jpg">
    </div>

    <!-- BLOCO AGRUPADO -->
    <div class="col-span-4 rounded-xl sm:col-span-2 md:col-span-2 flex flex-col gap-2">
      <!-- NESTED ROW 1 -->
      <div class="customcard relative overflow-hidden rounded-xl pt-16 sm:pt-32 pb-2 h-32">
        <!-- Texto animado vai-e-volta (loop contínuo) -->
        <div class="absolute top-1/2 left-0 w-full -translate-y-1/2 pointer-events-none overflow-hidden">
          <div class="marquee-track">
            <img src="assets/Group 1.png" class="minespan" />
            <img src="assets/Group 1.png" class="minespan" />
          </div>
        </div>
      </div>
      <!-- NESTED ROW 2
        -->
      <div class="customcard  rounded-xl pt-16 sm:pt-32 pb-2">
        <div class="grid-rows-1 flex ">
          <h1 class="text-white pl-4 font-['Fira_Mono'] ">Resume</h1>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="SVGRepo_iconCarrier">
              <path d="M7 17L17 7M17 7H8M17 7V16" stroke="#ffffff" stroke-width="1" stroke-linecap="round"
                stroke-linejoin="round"></path>
            </g>
          </svg>
        </div>
      </div>
    </div>


  </div>

  <script src="js/custom.js"></script>
</body>

</html>
